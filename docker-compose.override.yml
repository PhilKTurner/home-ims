services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: hims-server-debug
    container_name: hims-server-debug
    depends_on:
      - eventstore
      - db
    ports:
      - 5000:80
      - 5001:443
      - 9229:9229 # Expose the debugging port
    secrets:
      - hims-rootpw
      - hims-eventstore-rootpw
      - hims-db-rootpw
      - hims-db-userpw
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/HomeIMS.Server.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=thisisatest
    volumes:
      - ~/.aspnet/https:/https:ro
      - ~/.vsdbg:/remote_debugger:rw

  adminer:
    image: adminer
    container_name: hims-adminer
    restart: always
    depends_on:
      - eventstore
      - db
    ports:
      - 5002:8080